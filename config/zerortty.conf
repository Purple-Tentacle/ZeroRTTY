# ZeroRTTY defaults. Changes made in the app are written to
# ~/.config/zerortty/zerortty.conf, which takes precedence over this file.

[application]
dark_mode=no
small_font=no
# yes: type a line, correct it, ENTER sends. no: every key is sent at once.
line_mode=yes

[station]
my_call=DA2IT
# Next contest serial number, sent for [NR] in macros.
serial=1

[radio]
# The KXUSB cable. Baud must match MENU:RS232 on the KX2.
device=/dev/ttyUSB0
baud=38400
# Punctuation to allow in transmitted text beyond . , ? / -
extra_tx_characters=

[macros]
# [MY] is your call, [CALL] the DX call set with Fn+9, [NR] the serial number.
1=CQ CQ CQ DE [MY] [MY] [MY] K
2=CQ POTA CQ POTA DE [MY] [MY] K
3=[CALL] DE [MY] 599 599 K
4=[CALL] TU 73 DE [MY] SK
5=QRZ DE [MY] K
6=[CALL] AGN AGN K
7=[MY]
8=[CALL] 599 [NR] [NR]
